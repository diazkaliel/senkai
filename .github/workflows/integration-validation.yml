name: SENKAI Combined Integration

on:
  push:
    branches:
      - 'integration/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Combined backend regression
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      DATABASE_URL: sqlite+aiosqlite:///./ci_senkai_integration.db
      WORKSHOP_SECRET_KEY: ci-only-integration-credential-never-use-in-production
      RATE_LIMIT_ORDERS_PER_MINUTE: '1000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q backend/app backend/tests
      - run: pytest backend/tests -q

  frontend:
    name: Combined frontend regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test frontend/tests/*.test.mjs
