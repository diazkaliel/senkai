name: SENKAI Security Regression

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "security/**"

permissions:
  contents: read

jobs:
  backend:
    name: Backend security and API tests
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      DATABASE_URL: sqlite+aiosqlite:///./ci_senkai_studio.db
      WORKSHOP_SECRET_KEY: ci-only-regression-credential-never-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q backend/app backend/tests
      - run: pytest backend/tests -q

  frontend:
    name: Frontend sanitization tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test frontend/tests/security.test.mjs
