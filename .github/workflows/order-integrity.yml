name: SENKAI Order Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "fix/fase-2-*"

permissions:
  contents: read

jobs:
  backend:
    name: Order Integrity Backend
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      DATABASE_URL: sqlite+aiosqlite:///./ci_order_integrity.db
      WORKSHOP_SECRET_KEY: ci-only-order-integrity-credential
      RATE_LIMIT_ORDERS_PER_MINUTE: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q backend/app backend/tests
      - run: pytest backend/tests -q

  frontend:
    name: Checkout Idempotency Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test frontend/tests/order_idempotency.test.mjs
